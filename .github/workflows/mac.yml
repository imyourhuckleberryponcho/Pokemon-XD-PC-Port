# Mac build (docs/MAC.md). UNRUN: written on a Windows PC without a Mac and without a way to start a workflow.
# Expect the first runs to fail somewhere; every run uploads its logs so the next fix can be made from them.
# (A person with a Mac does the same by hand, for free: games/xd/mac/Building on a Mac.txt.)
#
# Started BY HAND only (Actions tab > "Mac build" > Run workflow): the repository is private, and private
# repositories pay for Mac minutes out of a small monthly allowance (docs/MAC.md, "What a run costs").
# To spend as few of them as possible (2026-11-11, as unrun as the rest):
#  - "stage" = compile (the default) only builds; choose "all" once the build is clean;
#  - the port's and the game's own files are compiled first (build_mac.sh XD_GAME_FIRST): their errors are in
#    the log after the first minutes, and a hopeless run can be cancelled by hand;
#  - a compiler cache (ccache) is kept between runs, also after failed ones: the run after a fix compiles only
#    what changed. The first run pays for everything once.
#
# What it does: builds the x86_64 Mac program on an Apple-silicon machine, runs every test program that needs no
# disc (through Rosetta 2, as a player's Mac would), starts the game without a disc to prove that it launches and
# places its memory below 4 GB, makes "Pokemon XD PC <version> - Mac (test).zip" and uploads it with the logs.
# No game data is needed, used or uploaded.
#
# 0.7.0 (prepared 2026-11-19 without a Mac; docs/MAC.md "Mac pass for 0.7.0"): stage "all" is made to catch EVERYTHING in ONE
# run. After the compile (game files first, then the list in build_mac.sh, then every other target, failures listed) it runs:
# every *_test program that needs no disc (tools/mac/run_all_tests.sh: the same rule as the Windows / Linux unit runs, plus a
# "NOT BUILT" check against the build system's own list), the converters' Python tests, the launcher's scripted tests that need
# no disc, the replay video encoder (AVFoundation, now with sound) on a 30-frame clip, the frozen converters, the packed app
# (signatures of every helper, quarantine, portable data folder next to the .app) and the no-disc game start. A step that
# finds a problem does NOT stop the later ones (they are continue-on-error); the last step ("Verdict") lists every step's
# outcome and fails the run if any one of them did. logs/VERDICT.txt is the one file to read first.
#
# The game's source (the decompilation) is not in this repository. The workflow fetches it from the
# decompilation's repository. That repository is public (checked 2026-11-11), so nothing is needed for that:
# with no secret DECOMP_DEPLOY_KEY the key below is empty and it is fetched like any public repository. It must
# hold the decompilation commit this port builds on (or newer): push its update first. Should it ever be made
# private: a read-only key as the secret DECOMP_DEPLOY_KEY (docs/MAC.md, "The one secret"); no credential is
# ever written in a file.
name: Mac build

on:
  workflow_dispatch:
    inputs:
      decomp_repository:
        description: "The decompilation's repository (owner/name)"
        required: true
        default: "imyourhuckleberryponcho/Pokemon-XD-Decomp"
      decomp_commit:
        description: "Its commit to build (empty: the newest)"
        required: false
        default: ""
      keep_going:
        description: "Go on after compile errors and list them all (1) or stop at the first (0)"
        required: false
        default: "1"
      stage:
        description: "compile = only build (cheapest, until the build is clean); all = also tests, start, zip"
        required: false
        type: choice
        options:
          - compile
          - all
        default: "compile"
      machine:
        description: "GitHub's Mac machine: macos-15 = Apple silicon (as a player's Mac); macos-15-intel when the first has no free machines"
        required: false
        type: choice
        options:
          - macos-15
          - macos-15-intel
        default: "macos-15-intel"

permissions:
  contents: read

concurrency:
  group: mac-build
  cancel-in-progress: true

jobs:
  mac:
    name: Mac app (x86_64 through Rosetta 2), untested
    # (2026-11-11: the first run never got an Apple-silicon machine, "capacity constraints"; nothing was charged.
    # The Intel machine builds the same x86_64 program, without Rosetta in between.)
    runs-on: ${{ inputs.machine || 'macos-15' }}
    timeout-minutes: 75
    env:
      XD_BUILD_JOBS: "3"
      BIN: build/mac/mac-release/bin
      # The compiler cache (ccache): what a run compiled is kept, so the run after a fix compiles only the files
      # that changed. Kept after failed runs too: those are the runs that get repeated.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: The port's source
        uses: actions/checkout@v7

      - name: Aurora, SDL and Borealis at the versions third_party/README.md names
        run: |
          set -eu
          # (plain clones, as on the developer's PC: they are not part of this repository)
          get() { # folder, repository, commit or tag
            if [ ! -f "third_party/$1/CMakeLists.txt" ]; then
              rm -rf "third_party/$1"
              git clone --filter=blob:none "https://github.com/$2" "third_party/$1"
              git -C "third_party/$1" checkout --detach "$3"
              git -C "third_party/$1" submodule update --init --recursive --depth 1
            fi
          }
          get aurora encounter/aurora 5794daa2ccbd3d2ddf01af788e51a8612850ffd1
          get SDL libsdl-org/SDL release-3.4.20
          get borealis encounter/borealis 8e9427fab92c1935a5d6bacadc6053c687f10c1e

      - name: The game's source (the decompilation), read only
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.decomp_repository }}
          ssh-key: ${{ secrets.DECOMP_DEPLOY_KEY }}
          path: decomp
          fetch-depth: 0
          persist-credentials: false

      - name: Snapshot of the game's source
        env:
          COMMIT: ${{ inputs.decomp_commit }}
        run: |
          set -eu
          python3 tools/sync_decomp.py --decomp "$PWD/decomp" --commit "${COMMIT:-HEAD}"
          cat snapshot/CURRENT.txt

      - name: Tools (Rosetta 2, Ninja, libclang for the table generator)
        run: |
          set -eu
          softwareupdate --install-rosetta --agree-to-license || true
          command -v ninja >/dev/null || brew install ninja
          command -v ccache >/dev/null || brew install ccache || true
          ccache --version | head -n 1 || echo "no ccache: this run compiles everything"
          python3 -m pip install --user --break-system-packages libclang || python3 -m pip install --user libclang
          clang --version
          cmake --version
          arch -x86_64 /usr/bin/true && echo "Rosetta works"

      - name: Downloaded libraries (Dawn, nod and the rest of Aurora's), kept between runs
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: build/mac/mac-release/_deps
          key: mac-deps-${{ hashFiles('third_party/README.md', 'third_party/patches/aurora/*.patch') }}

      - name: Compiled files of earlier runs (the newest cache)
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: mac-ccache-${{ inputs.machine || 'macos-15' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mac-ccache-${{ inputs.machine || 'macos-15' }}-

      - name: Build
        id: build
        env:
          KEEP_GOING: ${{ inputs.keep_going }}
          STAGE: ${{ inputs.stage }}
          # 0.7.0: the replay video encoder (Objective-C++, AVFoundation) is compiled in both stages; stage "all" also builds EVERY other target
          XD_EXTRA_CMAKE: "-DXD_BUILD_AVF_ENCODER=ON"
          XD_ALL_TARGETS: ${{ inputs.stage == 'all' && '1' || '0' }}
        run: |
          # (GitHub starts a step's script with "bash -e": switched off here, the result is looked at by hand)
          set +e -u
          mkdir -p logs
          ccache --zero-stats > /dev/null 2>&1
          START=$(date +%s)
          # (stage "compile" is never a build anyone gets: game files the table generator cannot read yet are
          # listed and the build goes on, so one run shows every other error too. Stage "all" stays strict.)
          ALLOW_UNREAD=0
          [ "$STAGE" = compile ] && ALLOW_UNREAD=1
          XD_PYTHON="$(command -v python3)" XD_KEEP_GOING="$KEEP_GOING" XD_COMPILER_CACHE=1 XD_GAME_FIRST=1 \
            XD_DISC_TABLES_ALLOW_UNREAD="$ALLOW_UNREAD" bash ./build_mac.sh > logs/build.log 2>&1
          RESULT=$?
          MINUTES=$(( ($(date +%s) - START + 59) / 60 ))
          # (the configure step finished: its downloads are whole and may be kept for the next run)
          [ -f build/mac/mac-release/build.ninja ] && echo "configured=1" >> "$GITHUB_OUTPUT"
          tail -n 60 logs/build.log
          grep -n "error:" logs/build.log | head -n 400 > logs/errors.txt || true
          cp build/mac/mac-release/disc_tables/flags.json logs/disc_tables_flags.json 2>/dev/null || true
          cp build/mac/mac-release/linux_first/sys/types.h logs/linux_first_sys_types.h.txt 2>/dev/null || true
          ccache --show-stats > logs/ccache.txt 2>&1 || true
          grep -n "build_mac.sh:" logs/build.log
          cp build/mac/mac-release/other_targets.log logs/other_targets.log 2>/dev/null || true
          echo "errors: $(wc -l < logs/errors.txt)"
          # (the errors with the lines after each, here in the step's own log too: on 2026-11-11 GitHub failed to
          # store the logs download and a run's 42 errors were lost with it)
          echo "===== compile errors, with the lines after each ====="
          grep -n -A 4 "error:" logs/build.log | head -n 900
          echo "===== end of the compile errors ====="
          {
            echo "### Mac build: $([ $RESULT = 0 ] && echo finished || echo FAILED)"
            echo "- build step: about $MINUTES minutes"
            echo "- compile errors listed: $(wc -l < logs/errors.txt) (logs/errors.txt in the mac-build-logs download)"
            echo '```'
            grep "build_mac.sh:" logs/build.log
            grep -i -E "hit|miss" logs/ccache.txt | head -n 8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RESULT

      - name: Keep the compiled files for the next run (also after a failure)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: mac-ccache-${{ inputs.machine || 'macos-15' }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the downloaded libraries for the next run
        if: always() && steps.build.outputs.configured == '1' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/mac/mac-release/_deps
          key: mac-deps-${{ hashFiles('third_party/README.md', 'third_party/patches/aurora/*.patch') }}

      # 0.7.0: EVERY unit test program that needs no disc, found by looking at the bin folder (not a list that goes stale): the same rule as
      # the Windows and Linux unit runs (tools/mac/run_all_tests.sh says which exit codes mean what). The names the build system itself
      # knows ("ninja -t targets") are compared with what was built: a test that did not build is "NOT BUILT", a failure of its own.
      - name: Every unit test that needs no disc
        id: tests
        if: success() && inputs.stage == 'all'
        continue-on-error: true
        run: |
          set +e -u
          ninja -C build/mac/mac-release -t targets all 2>/dev/null | sed -n 's|^bin/\([^/: ]*_test\):.*|\1|p' | sort -u > logs/expected_tests.txt
          echo "the build system knows $(wc -l < logs/expected_tests.txt | tr -d ' ') test programs"
          bash tools/mac/run_all_tests.sh "$BIN" logs logs/expected_tests.txt
          RC=$?
          { echo "### Unit tests"; echo '```'; tail -n 1 logs/tests_summary.txt; grep -v -E "^(PASS|tests:)" logs/tests_summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      # 0.7.0: the converters' Python tests (made-up data only, no disc): the Ultra Sun / Ultra Moon pieces, the Gen 4 text, the model swap tool.
      # In a venv of their own, as the frozen converters are made (numpy + Pillow).
      - name: The converters' Python tests (no disc)
        id: pytests
        if: success() && inputs.stage == 'all'
        continue-on-error: true
        run: |
          set +e -u
          python3 -m venv "$RUNNER_TEMP/pytest_venv" > logs/pytests_venv.log 2>&1
          "$RUNNER_TEMP/pytest_venv/bin/python" -m pip install --quiet numpy pillow >> logs/pytests_venv.log 2>&1 || { cat logs/pytests_venv.log; exit 1; }
          bash tools/mac/python_tests.sh "$RUNNER_TEMP/pytest_venv/bin/python" logs
          RC=$?
          { echo "### Python tests"; echo '```'; cat logs/pytests_summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: Start the game without a disc (does it launch, is its memory below 4 GB)
        id: start
        continue-on-error: true
        if: success() && inputs.stage == 'all'
        run: |
          # ("bash -e" off: the game is expected to end with an error code here, no disc was given)
          set +e -u
          file "$BIN/xd"
          xcodebuild -version; ld -v 2>&1 | head -n 3
          # The program file's header: it must NOT say PIE (Apple's newer linker was reported to ignore -no_pie:
          # golang.org/issue/61229), and __TEXT must start at 0x40000000.
          otool -hv "$BIN/xd" | tee logs/xd_header.txt
          if grep -qw PIE logs/xd_header.txt; then echo "xd is position independent: -no_pie was ignored"; exit 1; fi
          otool -l "$BIN/xd" | grep -A4 -E "segname __(PAGEZERO|TEXT|XDLOW|XDMEM1|XDMEMU|XDLC|XDSTK)$" | grep -E "segname|vmaddr|vmsize" > logs/xd_segments.txt
          cat logs/xd_segments.txt
          otool -L "$BIN/xd" > logs/xd_libraries.txt
          # The first tester's report script does the rest, exactly as a person with a Mac would run it: this
          # machine, the program file's layout, one start with no disc (the program places its memory, prints the
          # proof lines, then stops because no disc was given) and the verdicts on top. The report is uploaded
          # with the logs (logs/first_run_report.txt). The script keeps its own settings, card and cache folders.
          XD_REPORT_FILE="$PWD/logs/first_run_report.txt" perl -e 'alarm 300; exec @ARGV' \
            bash games/xd/mac/first_run_report.sh "$PWD/$BIN/xd" > logs/first_run_report_run.log 2>&1
          echo "report script exit code $?" >> logs/first_run_report_run.log
          cat logs/first_run_report_run.log
          if [ ! -s logs/first_run_report.txt ]; then echo "the report script wrote no report"; exit 1; fi
          sed -n '/^======== 3\. Start/,/^---- end ----/p' logs/first_run_report.txt
          # Passed = the memory line is there and the report found no problem.
          grep -q "mac: game memory in place at 0x80000000 (second view at 0xC0000000: same memory)" logs/first_run_report.txt || { echo "the game memory line is missing"; exit 1; }
          # (problems the report lists do not stop the run: the packaging step below is to be tried too. They go
          # into the run's summary. Run 8, 2026-11-11: the C library's memory is above 4 GB, docs/MAC.md risk 1.)
          if grep -q "^PROBLEM" logs/first_run_report.txt; then
            { echo "### First start: problems listed"; echo '```'; grep "^PROBLEM" logs/first_run_report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The Battle Revolution models helper (the launcher's Extra assets page runs it; tools/pbr_convert/
      # package_pbr_models.py): pbr_models.py frozen with PyInstaller (a program that needs no Python), with Mac nod
      # library (libnod.dylib, from the nod package Aurora downloaded for the build) beside it. UNRUN on a Mac.
      # It must run on the same kind of machine as the build (PyInstaller cannot cross-build): the Intel machine
      # gives an x86_64 program, as xd is. continue-on-error: a failure here must not stop the app and the zip;
      # without the folder package_mac.sh simply leaves the helper out (and says so in its log).
      # Since 0.4.1 the converter is the C++ program built with the game (build_mac.sh's pbr_models target):
      # package_mac.sh takes it from the build. This step only freezes the old Python one when the C++ one is
      # missing (a build of an older branch).
      - name: Battle Revolution models helper (pbr_models), frozen
        id: pbrfreeze
        if: success() && inputs.stage == 'all'
        continue-on-error: true
        run: |
          set -eu
          set -o pipefail
          if [ -x "$BIN/pbr_models" ]; then
            echo "the C++ pbr_models is built: no Python freeze needed" | tee logs/pbr_models_package.log
            "$BIN/pbr_models" --version 2>&1 | tee -a logs/pbr_models_package.log
            otool -L "$BIN/pbr_models" 2>&1 | tee -a logs/pbr_models_package.log
            exit 0
          fi
          NOD="$(find build/mac/mac-release -name libnod.dylib -not -path "*/dist/*" | head -n 1)"
          echo "nod library: ${NOD:-NOT FOUND}"
          find build/mac/mac-release -iname "*nod*" -not -path "*/CMakeFiles/*" -maxdepth 4 | head -n 20
          [ -n "$NOD" ] || { echo "no libnod.dylib in the build (the nod package has only libnod.a?)"; exit 1; }
          python3 tools/pbr_convert/package_pbr_models.py --nod "$PWD/$NOD" --dist "$PWD/build/pbr_models_dist_mac"             --venv "$RUNNER_TEMP/pbr_models_venv" 2>&1 | tee logs/pbr_models_package.log
          # a start without discs must print the version (proves the frozen program and its libraries load)
          build/pbr_models_dist_mac/pbr_models/pbr_models --version 2>&1 | tee -a logs/pbr_models_package.log
          # and the disc library must load through ctypes (what every real run needs first)
          NOD_DLL="$PWD/build/pbr_models_dist_mac/pbr_models/libnod.dylib" python3 -c "import ctypes,sys; ctypes.CDLL(sys.argv[1]); print('libnod.dylib loads')" "$PWD/build/pbr_models_dist_mac/pbr_models/libnod.dylib" 2>&1 | tee -a logs/pbr_models_package.log

      # The Ultra Sun / Ultra Moon models helper (the launcher's Extra assets page runs it; tools/n3ds/package_usum_models.py): the
      # Python converter frozen with PyInstaller, Mac nod library beside it, like the pbr_models freeze above. UNRUN on a Mac.
      # continue-on-error: without the folder package_mac.sh leaves the helper out (and says so in its log).
      - name: Ultra Sun / Ultra Moon models helper (usum_models), frozen
        id: usumfreeze
        if: success() && inputs.stage == 'all'
        continue-on-error: true
        run: |
          set -eu
          set -o pipefail
          NOD="$(find build/mac/mac-release -name libnod.dylib -not -path "*/dist/*" | head -n 1)"
          echo "nod library: ${NOD:-NOT FOUND}"
          [ -n "$NOD" ] || { echo "no libnod.dylib in the build"; exit 1; }
          python3 tools/n3ds/package_usum_models.py --nod "$PWD/$NOD" --dist "$PWD/build/usum_models_dist_mac" --venv "$RUNNER_TEMP/pbr_models_venv" 2>&1 | tee logs/usum_models_package.log
          # a start without discs must print the version (proves the frozen program and its libraries load)
          build/usum_models_dist_mac/usum_models/usum_models --version 2>&1 | tee -a logs/usum_models_package.log
          # 0.7.0: the modules and data files the Gen 4 / Ultra Sun work added must be inside the freeze (a missing hidden import only shows
          # when the converter really starts): the data files are there, and a start with made-up arguments reaches its own error message
          # (a ModuleNotFoundError from the frozen Python would be the finding; its own "error ..." line plus a Traceback is normal).
          for f in usum_dex_map.json usum_gen4_plan.json gen57_speed_numbers.json; do
            find build/usum_models_dist_mac/usum_models -name "$f" | grep -q . || { echo "MISSING in the freeze: $f"; exit 1; }
          done
          # 0.7.0 (the launcher's Gen 5-7 build): every module and data file of it is inside the freeze
          build/usum_models_dist_mac/usum_models/usum_models --selfcheck 2>&1 | tee -a logs/usum_models_package.log
          grep -q '^selfcheck ok' logs/usum_models_package.log || { echo 'the frozen converter misses a Gen 5-7 module'; exit 1; }
          set +e
          perl -e 'alarm 120; exec @ARGV' build/usum_models_dist_mac/usum_models/usum_models --rom /nonexistent.cia --xd-disc /nonexistent.iso --out "$RUNNER_TEMP/um_out" --gen4-pack "$RUNNER_TEMP/um_pack" > logs/usum_models_badargs.log 2>&1
          echo "bad-arguments start exit $?" | tee -a logs/usum_models_badargs.log
          cat logs/usum_models_badargs.log | head -n 20
          if grep -q -E "ModuleNotFoundError|ImportError|No module named" logs/usum_models_badargs.log; then echo "the frozen converter fails on its own imports"; exit 1; fi
          # its pack builder partner (the C++ pbr_models, 0.7.0 --gen4-source) must know the option too
          "$BIN/pbr_models" --gen4-source /nonexistent --xd-disc /nonexistent.iso --gen4-pack "$RUNNER_TEMP/um_pack2" > logs/pbr_models_gen4source.log 2>&1
          echo "pbr_models --gen4-source exit $?" | tee -a logs/pbr_models_gen4source.log
          if grep -q -i -E "unknown (option|argument)|unrecognized" logs/pbr_models_gen4source.log; then echo "pbr_models does not know --gen4-source"; exit 1; fi

      - name: The app and the zip
        id: pkg
        if: success() && inputs.stage == 'all'
        run: |
          set -eu
          set -o pipefail
          bash games/xd/mac/package_mac.sh "$PWD/$BIN" "$PWD/dist" 2>&1 | tee logs/package.log
          ls -la dist

      - name: The packaged app, checked (signature, libraries, helpers, quarantine, one start from the unpacked zip)
        id: pkgcheck
        continue-on-error: true
        if: success() && inputs.stage == 'all'
        run: |
          set +e
          # Unpacked somewhere else, as a player would: the libraries loaded must be the ones inside the app.
          rm -rf "$RUNNER_TEMP/unzipped"; mkdir -p "$RUNNER_TEMP/unzipped"
          ditto -x -k dist/*.zip "$RUNNER_TEMP/unzipped"
          APP="$(find "$RUNNER_TEMP/unzipped" -name "Pokemon XD.app" -maxdepth 3 | head -n 1)"
          {
            echo "app: $APP"
            echo "== codesign --verify (app)"; codesign --verify --strict --verbose=4 "$APP" 2>&1; echo "exit code $?"
            echo "== codesign -dv (app)"; codesign -dv --verbose=4 "$APP" 2>&1
            for f in "$APP"/Contents/Frameworks/*.dylib "$APP/Contents/MacOS/xd" "$APP/Contents/MacOS/xd_launcher"; do
              echo "== codesign --verify $(basename "$f")"; codesign --verify --strict --verbose=4 "$f" 2>&1; echo "exit code $?"
              echo "== otool -L $(basename "$f")"; otool -L "$f"
            done
            echo "== files"; ls -laR "$APP"
            echo "== paths outside the app and the system (must be none):"
            for f in "$APP"/Contents/Frameworks/*.dylib "$APP/Contents/MacOS/xd" "$APP/Contents/MacOS/xd_launcher"; do
              otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -E "^(/usr/local|/opt/|@rpath)" | sed "s|^|$(basename "$f"): |"
            done
            echo "(end of list)"
          } > logs/package_check.txt 2>&1
          cat logs/package_check.txt
          # One start of the packaged program without a disc: which libraries the system really loads.
          mkdir -p "$RUNNER_TEMP/pk/settings" "$RUNNER_TEMP/pk/card" "$RUNNER_TEMP/pk/cache"
          # (DYLD_PRINT_LIBRARIES is set by the perl wrapper itself, just before it starts ./xd: set outside, it listed perl's own
          #  libraries from /usr/local/Cellar/perl, which belong to the harness, not to the app)
          ( cd "$APP/Contents/MacOS" && XD_TEST_RUN=1 XD_NO_MESSAGE_BOXES=1 XD_CRASH_REPORT=0 \
              XD_SETTINGS_DIR="$RUNNER_TEMP/pk/settings" XD_CARD_DIR="$RUNNER_TEMP/pk/card" XD_CACHE_DIR="$RUNNER_TEMP/pk/cache" \
              perl -e 'alarm 120; $ENV{DYLD_PRINT_LIBRARIES} = 1; exec @ARGV' ./xd > "$GITHUB_WORKSPACE/logs/package_start.txt" 2>&1
            echo "exit code $?" >> "$GITHUB_WORKSPACE/logs/package_start.txt" )
          grep -v "^dyld\[[0-9]*\]: <.*> /System/\|^dyld\[[0-9]*\]: <.*> /usr/lib/" logs/package_start.txt | head -n 120
          PROBLEMS_EXTRA=""
          # 0.7.0: every helper program inside the app. (a) every Mach-O file under Resources carries a signature that verifies (the
          # frozen converters are made of many files; package_mac.sh signs them one by one); (b) each helper starts from its link in
          # Contents/MacOS (the launcher's path to it) and prints its version / usage; (c) with the "downloaded from the internet" mark
          # (com.apple.quarantine) on every file, as a browser leaves it, the same helpers still start from a terminal. (c) is a finding only:
          # GitHub's machines may not enforce Gatekeeper at all, so a pass here is no proof, a failure is.
          {
            echo "== signatures of every Mach-O file in Resources"
            BAD=0; COUNT=0
            while read -r f; do
              if file -b "$f" | grep -q "Mach-O"; then
                COUNT=$((COUNT + 1))
                codesign --verify --strict "$f" > "$RUNNER_TEMP/cs.txt" 2>&1 || { BAD=$((BAD + 1)); echo "NOT SIGNED OK: ${f#"$APP"/}: $(head -n 1 "$RUNNER_TEMP/cs.txt")"; }
              fi
            done < <(find "$APP/Contents/Resources" -type f)
            echo "Mach-O files in Resources: $COUNT, without a good signature: $BAD"
            echo "== helpers through the links in Contents/MacOS"
            for h in pbr_models/pbr_models pbr_models/colo_models usum_models/usum_models usum_models/usum_models_cpp xd_languages/xd_languages; do
              if [ -e "$APP/Contents/MacOS/$h" ]; then
                echo "-- $h"; ls -laL "$APP/Contents/MacOS/$h"
                perl -e 'alarm 60; exec @ARGV' "$APP/Contents/MacOS/$h" --version 2>&1 | head -n 3; echo "exit ${PIPESTATUS[0]}"
              else
                echo "-- $h: NOT IN THE APP"
              fi
            done
            echo "== the same with the quarantine mark on every file (a downloaded zip)"
            rm -rf "$RUNNER_TEMP/quarantined"; mkdir -p "$RUNNER_TEMP/quarantined"
            ditto "$APP" "$RUNNER_TEMP/quarantined/Pokemon XD.app"
            xattr -rw com.apple.quarantine "0083;5f5e1000;Safari;" "$RUNNER_TEMP/quarantined/Pokemon XD.app" 2>&1 | head -n 3
            xattr -p com.apple.quarantine "$RUNNER_TEMP/quarantined/Pokemon XD.app/Contents/MacOS/xd" 2>&1
            for h in usum_models/usum_models pbr_models/pbr_models; do
              perl -e 'alarm 60; exec @ARGV' "$RUNNER_TEMP/quarantined/Pokemon XD.app/Contents/MacOS/$h" --version 2>&1 | head -n 3; echo "quarantined $h exit ${PIPESTATUS[0]}"
            done
            ( cd "$RUNNER_TEMP/quarantined/Pokemon XD.app/Contents/MacOS" && XD_NO_LAUNCHER=1 XD_TEST_RUN=1 XD_NO_MESSAGE_BOXES=1 XD_CRASH_REPORT=0 \
                XD_SETTINGS_DIR="$RUNNER_TEMP/pk/settings" XD_CARD_DIR="$RUNNER_TEMP/pk/card" XD_CACHE_DIR="$RUNNER_TEMP/pk/cache" \
                perl -e 'alarm 120; exec @ARGV' ./xd_launcher 2>&1 | tail -n 4; echo "quarantined launcher -> game hand-over exit ${PIPESTATUS[0]}" )
          } > logs/package_helpers.txt 2>&1
          cat logs/package_helpers.txt
          grep -q "without a good signature: 0$" logs/package_helpers.txt || PROBLEMS_EXTRA="$PROBLEMS_EXTRA helper-signatures"
          grep -q "NOT IN THE APP" logs/package_helpers.txt && PROBLEMS_EXTRA="$PROBLEMS_EXTRA helper-missing"
          grep -q "Traceback\|ModuleNotFoundError" logs/package_helpers.txt && PROBLEMS_EXTRA="$PROBLEMS_EXTRA frozen-python-error"
          grep -q -E "^quarantined (usum|pbr)_models/[a-z_]+ exit [1-9]|Killed: 9|^quarantined launcher -> game hand-over exit (0|1[0-9][0-9])$" logs/package_helpers.txt && PROBLEMS_EXTRA="$PROBLEMS_EXTRA quarantine-blocks-helper"
          PROBLEMS=""
          grep -q "does NOT verify\|SIGNING FAILED\|signing failed" logs/package.log && PROBLEMS="$PROBLEMS signing"
          grep -q -E "^[^ ]+: (/usr/local|/opt/|@rpath)" logs/package_check.txt && PROBLEMS="$PROBLEMS library-paths"
          grep -v "/Cellar/perl/\|/libperl\.dylib" logs/package_start.txt | grep -q "/usr/local/\|/opt/homebrew/" && PROBLEMS="$PROBLEMS loaded-from-outside"
          grep -q "^exit code 1$" logs/package_start.txt || PROBLEMS="$PROBLEMS start"
          grep -q "mac: low memory self-test: OK" logs/package_start.txt || PROBLEMS="$PROBLEMS low-memory"
          PROBLEMS="$PROBLEMS$PROBLEMS_EXTRA"
          if [ -n "$PROBLEMS" ]; then
            { echo "### The packaged app: problems"; echo "$PROBLEMS (logs/package.log, package_check.txt, package_helpers.txt, package_start.txt)"; } >> "$GITHUB_STEP_SUMMARY"
            echo "PROBLEMS with the packaged app:$PROBLEMS"
            exit 1
          else
            echo "### The packaged app: signature verifies, libraries from inside the app, start OK" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The launcher (the app's main program), run from the unpacked zip as a player's Mac would run it: no disc, a test
      # script (XD_LAUNCHER_SCRIPT, launcher/README.md) draws three pages, takes a picture of each and quits. SDL's
      # software renderer (SDL_RENDER_DRIVER=software) so that no graphics card is needed on the machine. The pictures
      # go into the logs download (logs/launcher_shots). Also: the launcher with XD_NO_LAUNCHER=1 must hand over to the
      # game (a start with no disc, as in the step before), the pbr_models link must work, and the launcher's Extra assets
      # engine test (launcher_extra_test: starting programs, waiting, cancelling) is built and run. continue-on-error: a
      # failure here is a finding, it must not lose the zip. UNRUN on a Mac.
      - name: The launcher in the packaged app (pages without a disc, hand-over to the game, helper link)
        id: launcher
        if: success() && inputs.stage == 'all'
        continue-on-error: true
        run: |
          set +e
          mkdir -p logs/launcher_shots
          APP="$(find "$RUNNER_TEMP/unzipped" -name "Pokemon XD.app" -maxdepth 3 | head -n 1)"
          L="$APP/Contents/MacOS/xd_launcher"
          {
            echo "app: $APP"; file "$L"; otool -L "$L"
            echo "== main program named in Info.plist:"; /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Contents/Info.plist"
            echo "== helper link:"; ls -laL "$APP/Contents/MacOS/pbr_models" 2>&1 | head -n 12
            "$APP/Contents/MacOS/pbr_models/pbr_models" --version 2>&1
            echo "== fonts:"; ls -laL "$APP/Contents/MacOS/fonts" 2>&1 | head
          } > logs/launcher_smoke.txt 2>&1
          cat logs/launcher_smoke.txt
          mkdir -p "$RUNNER_TEMP/lsmoke/settings" "$RUNNER_TEMP/lsmoke/cache" "$RUNNER_TEMP/lsmoke/card"
          SHOTS="$PWD/logs/launcher_shots"
          # (the launcher's data folder is SDL's: ~/Library/Application Support/Pokemon XD of this runner, thrown away
          # with it; settings and caches are the run's own folders)
          ( cd "$APP/Contents/MacOS" && XD_LAUNCHER_SCRIPT="size:1100x760|page:disc|shot:$SHOTS/01_disc.png|page:settings|shot:$SHOTS/02_settings.png|page:extra|shot:$SHOTS/03_extra.png|quit" \
              XD_SETTINGS_DIR="$RUNNER_TEMP/lsmoke/settings" XD_CACHE_DIR="$RUNNER_TEMP/lsmoke/cache" XD_NO_MESSAGE_BOXES=1 \
              SDL_RENDER_DRIVER=software SDL_AUDIODRIVER=dummy \
              perl -e 'alarm 120; exec @ARGV' ./xd_launcher > "$GITHUB_WORKSPACE/logs/launcher_run.txt" 2>&1
            echo "exit code $?" >> "$GITHUB_WORKSPACE/logs/launcher_run.txt" )
          head -n 60 logs/launcher_run.txt
          ls -la logs/launcher_shots
          PROBLEMS=""
          grep -q "^exit code 0$" logs/launcher_run.txt || PROBLEMS="$PROBLEMS launcher-exit"
          for n in 01_disc 02_settings 03_extra; do [ -s "logs/launcher_shots/$n.png" ] || PROBLEMS="$PROBLEMS shot-$n"; done
          # The launcher handing over to the game (no disc: the game stops with exit code 1, having placed its memory).
          ( cd "$APP/Contents/MacOS" && XD_NO_LAUNCHER=1 XD_TEST_RUN=1 XD_NO_MESSAGE_BOXES=1 XD_CRASH_REPORT=0 \
              XD_SETTINGS_DIR="$RUNNER_TEMP/lsmoke/settings" XD_CARD_DIR="$RUNNER_TEMP/lsmoke/card" XD_CACHE_DIR="$RUNNER_TEMP/lsmoke/cache" \
              perl -e 'alarm 120; exec @ARGV' ./xd_launcher > "$GITHUB_WORKSPACE/logs/launcher_handover.txt" 2>&1
            echo "exit code $?" >> "$GITHUB_WORKSPACE/logs/launcher_handover.txt" )
          tail -n 12 logs/launcher_handover.txt
          grep -q "mac: low memory self-test: OK" logs/launcher_handover.txt || PROBLEMS="$PROBLEMS handover"
          # 0.5.5: the launcher of 0.5.4 stopped ("no free 256 MB range below 4 GB", PortMem_LowAlloc) as soon as the player
          # had a save, because the save page reads the disc's names through the converter, which asks for game memory below
          # 4 GB, and an ordinary program on a Mac has none. XD_LAUNCHER_LOWMEM_PROBE=1 makes this very program make that one
          # call and print the result: it must now get ordinary memory (zeroed, aligned, usable), say so, and exit 0.
          ( cd "$APP/Contents/MacOS" && XD_LAUNCHER_LOWMEM_PROBE=1 XD_SETTINGS_DIR="$RUNNER_TEMP/lsmoke/settings" XD_CACHE_DIR="$RUNNER_TEMP/lsmoke/cache"               perl -e 'alarm 60; exec @ARGV' ./xd_launcher > "$GITHUB_WORKSPACE/logs/launcher_lowmem_probe.txt" 2>&1
            echo "exit code $?" >> "$GITHUB_WORKSPACE/logs/launcher_lowmem_probe.txt" )
          cat logs/launcher_lowmem_probe.txt
          grep -q "low-memory probe: .*zeroed and aligned: yes, ordinary memory: yes: OK" logs/launcher_lowmem_probe.txt || PROBLEMS="$PROBLEMS lowmem-probe"
          grep -q "^exit code 0$" logs/launcher_lowmem_probe.txt || PROBLEMS="$PROBLEMS lowmem-probe-exit"
          grep -q "Stopped (abort)" logs/launcher_lowmem_probe.txt && PROBLEMS="$PROBLEMS lowmem-probe-abort"
          # The launcher's own log file (a double-click shows no console): the scripted run above must have left one.
          LOGDIR="$HOME/Library/Application Support/Pokemon XD/logs"
          ls -la "$LOGDIR" > logs/launcher_logfile.txt 2>&1
          NEWEST="$(ls -t "$LOGDIR"/launcher_*.log 2> /dev/null | head -n 1)"
          if [ -n "$NEWEST" ]; then
            cp "$NEWEST" logs/launcher_logfile_copy.log
            grep -q "^\[launcher\]" "$NEWEST" || PROBLEMS="$PROBLEMS launcher-log-empty"
          else
            PROBLEMS="$PROBLEMS launcher-log-missing"
          fi
          # F10 / F12 / crash bundles on the Mac (docs/PARITY.md): the program must hold the real code (the picture
          # read-back and the bundle writer), not the "not on Linux yet" stand-ins. Needs no disc. A real F10 needs a
          # disc and a person: the tester presses F10 in the game and sends reports/report_*.
          { echo "== F10 code in xd:"; nm "$APP/Contents/MacOS/xd" 2>&1 | grep -E "PortShot_LinuxRequest|PortXD_BugReportPoll|PortXD_Screenshot"; } > logs/f10_code.txt 2>&1
          cat logs/f10_code.txt
          grep -q "PortShot_LinuxRequest" logs/f10_code.txt || PROBLEMS="$PROBLEMS f10-code"
          # The launcher's own engine test (starts programs, waits, cancels) with its stand-in converter.
          cmake --build build/mac/mac-release --target launcher_extra_test pbr_models_standin > logs/launcher_tests_build.log 2>&1 || PROBLEMS="$PROBLEMS tests-build"
          tail -n 5 logs/launcher_tests_build.log
          if [ -x "$BIN/launcher_extra_test" ]; then
            mkdir -p "$RUNNER_TEMP/lextra"
            perl -e 'alarm 300; exec @ARGV' "$BIN/launcher_extra_test" "$RUNNER_TEMP/lextra" > logs/launcher_extra_test.log 2>&1
            echo "launcher_extra_test exit code $?" | tee -a logs/launcher_extra_test.log
            grep -q "^launcher_extra_test exit code 0$" logs/launcher_extra_test.log || PROBLEMS="$PROBLEMS extra-test"
          else
            PROBLEMS="$PROBLEMS extra-test-missing"
          fi
          if [ -n "$PROBLEMS" ]; then
            { echo "### The launcher on the Mac: problems"; echo "$PROBLEMS (logs/launcher_run.txt, launcher_handover.txt, launcher_lowmem_probe.txt, launcher_logfile.txt, launcher_smoke.txt, f10_code.txt, launcher_shots/)"; } >> "$GITHUB_STEP_SUMMARY"
            echo "PROBLEMS with the launcher:$PROBLEMS"
            exit 1
          fi
          echo "### The launcher on the Mac: three pages drawn and photographed, hands over to the game, helper link works, engine test passes (pictures in the logs download: launcher_shots)" >> "$GITHUB_STEP_SUMMARY"

      # The updater on the Mac (docs/UPDATER.md "On each system"): its unit test (signatures, the three-system manifest,
      # zip with modes and links, the app swap script), then the launcher from the unpacked zip against a LOCAL feed on
      # this runner (127.0.0.1; nothing goes to the internet): the question, no network before it, Update now (the new app
      # waits beside the old one), the helper puts it in place after a restart, Go back, tampered files refused.
      # tools/test_updater_posix.py. continue-on-error: a failure is a finding, it must not lose the zip. UNRUN on a Mac.
      - name: The updater on the Mac (unit test, launcher with a local feed)
        id: updater
        if: success() && inputs.stage == 'all'
        continue-on-error: true
        run: |
          set +e
          PROBLEMS=""
          cmake --build build/mac/mac-release --target update_test > logs/update_test_build.log 2>&1 || PROBLEMS="$PROBLEMS update-test-build"
          tail -n 5 logs/update_test_build.log
          if [ -x "$BIN/update_test" ]; then
            mkdir -p "$RUNNER_TEMP/update_test_work"
            perl -e 'alarm 300; exec @ARGV' "$BIN/update_test" "$RUNNER_TEMP/update_test_work" > logs/update_test.log 2>&1 || PROBLEMS="$PROBLEMS update-test"
            grep -v '^ok' logs/update_test.log | tail -n 20
          else
            PROBLEMS="$PROBLEMS update-test-missing"
          fi
          APP="$(find "$RUNNER_TEMP/unzipped" -name "Pokemon XD.app" -maxdepth 3 | head -n 1)"
          mkdir -p logs/updater_shots
          python3 tools/test_updater_posix.py --system mac --app "$APP" --work "$RUNNER_TEMP/updater_test" > logs/updater_posix_test.log 2>&1 || PROBLEMS="$PROBLEMS updater-launcher"
          grep -v '^ok' logs/updater_posix_test.log | tail -n 40
          cp "$RUNNER_TEMP"/updater_test/shots/*.png logs/updater_shots/ 2>/dev/null
          cp -R "$RUNNER_TEMP"/updater_test/logs logs/updater_launcher_logs 2>/dev/null
          if [ -n "$PROBLEMS" ]; then
            { echo "### The updater on the Mac: problems"; echo "$PROBLEMS (logs/update_test.log, updater_posix_test.log, updater_launcher_logs/)"; } >> "$GITHUB_STEP_SUMMARY"
            echo "PROBLEMS with the updater:$PROBLEMS"
            exit 1
          fi
          echo "### The updater on the Mac: unit test and the launcher with a local feed passed (logs/updater_posix_test.log)" >> "$GITHUB_STEP_SUMMARY"

      # 0.6.0 pieces (docs/MAC.md, "Mac pass for 0.6.0"): everything new since the last real Mac run that needs no disc. Each
      # item prints one "[0.6.0] ..." line into logs/v060_summary.txt (and the step summary); a game disc is not on this
      # machine, so XG detection and the Japanese pack build are proven only as far as the code being present and
      # the tool starting from inside the app. continue-on-error: findings, never a lost zip. UNRUN on a Mac.
      - name: The 0.6.0 pieces (XG code, Japanese/PAL pack tool, fonts, background guard)
        id: v060
        if: success() && inputs.stage == 'all'
        continue-on-error: true
        run: |
          set +e
          APP="$(find "$RUNNER_TEMP/unzipped" -name "Pokemon XD.app" -maxdepth 3 | head -n 1)"
          S=logs/v060_summary.txt; : > "$S"
          say() { echo "[0.6.0] $*" | tee -a "$S"; }
          PROBLEMS=""
          # 1. (the unit tests of 0.6.0 are part of the generic unit-test step now: tools/mac/run_all_tests.sh)
          grep -q "^PASS        xd_save_region_test" logs/tests_summary.txt 2>/dev/null && say "save import region test (Japanese / European / USA saves): PASSED" || { say "save import region test: NOT PASSED (logs/tests_summary.txt)"; PROBLEMS="$PROBLEMS xd_save_region_test"; }
          # 2. The language pack tool, from inside the app (libraries, link, no disc): starts, and refuses a missing disc cleanly.
          X="$APP/Contents/MacOS/xd_languages/xd_languages"
          "$X" --version > logs/v060_xd_languages.txt 2>&1; echo "exit $?" >> logs/v060_xd_languages.txt
          mkdir -p "$RUNNER_TEMP/jp_out"
          perl -e 'alarm 120; exec @ARGV' "$X" --jp-disc /nonexistent/jp.iso --xd-disc /nonexistent/xd.iso --out "$RUNNER_TEMP/jp_out/pack" >> logs/v060_xd_languages.txt 2>&1; echo "bad-disc exit $?" >> logs/v060_xd_languages.txt
          cat logs/v060_xd_languages.txt
          grep -q "^xd_languages " logs/v060_xd_languages.txt && say "language/Japanese pack tool starts from inside the app: yes ($(head -n 1 logs/v060_xd_languages.txt))" || { say "language/Japanese pack tool starts from inside the app: NO"; PROBLEMS="$PROBLEMS xd_languages-start"; }
          grep -qi "^error can't read" logs/v060_xd_languages.txt && say "Japanese pack tool refuses a missing disc with a message: yes" || { say "Japanese pack tool refuses a missing disc with a message: NO"; PROBLEMS="$PROBLEMS jp-baddisc"; }
          [ ! -e "$RUNNER_TEMP/jp_out/pack" ] && [ ! -e "$RUNNER_TEMP/jp_out/pack.tmp" ] && say "no half-made pack folder left behind: yes" || say "no half-made pack folder left behind: NO (a leftover exists)"
          # 3. Fonts for the Japanese launcher text, and the launcher's own list of fonts through the link
          F="$APP/Contents/MacOS/fonts/NotoSansJP-Regular-subset.ttf"
          if [ -s "$F" ]; then say "Noto Sans JP subset in the app: yes ($(wc -c < "$F" | tr -d ' ') bytes, through the Contents/MacOS/fonts link)"; else say "Noto Sans JP subset in the app: NO"; PROBLEMS="$PROBLEMS noto"; fi
          # 4. XG mode: the code is in the program (a real XG disc is needed to run it)
          nm "$APP/Contents/MacOS/xd" > logs/v060_xd_symbols.txt 2>&1
          for sym in PortXD_IsXG PortXD_AddScriptBlock PortXD_XG_UseAbilityCapsule PortXD_UseXGSaves; do
            grep -q "_$sym\$" logs/v060_xd_symbols.txt && say "XG: $sym in xd: yes" || { say "XG: $sym in xd: NO"; PROBLEMS="$PROBLEMS xg-$sym"; }
          done
          strings -a "$APP/Contents/MacOS/xd" | grep -q "common.rel mapped at" && say "XG: the 'common.rel mapped at 80B18DC0' log line is in xd: yes" || say "XG: log line missing from xd"
          # 5. The background-run guard and the hidden window (docs/MAC.md): code present; the Mac keeps XD_WINDOW_HIDDEN off by default
          strings -a "$APP/Contents/MacOS/xd" | grep -q "the launcher that started this run has ended" && say "background guard (XD_PARENT_PID poll) in xd: yes" || { say "background guard in xd: NO"; PROBLEMS="$PROBLEMS guard"; }
          # 6. The guard itself, on macOS: a child that polls a parent pid with kill(pid, 0) ends when the parent is gone
          cat > "$RUNNER_TEMP/guard.c" <<'EOT'
          #include <errno.h>
          #include <signal.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <sys/types.h>
          #include <unistd.h>
          int main(int argc, char** argv) { pid_t p = (pid_t)atol(argv[1]); int n = 0; while (kill(p, 0) == 0 || errno == EPERM) { usleep(100000); if (++n > 100) { puts("guard: parent still there after 10 s"); return 2; } } puts("guard: parent gone, ending"); return 3; }
          EOT
          cc -o "$RUNNER_TEMP/guard" "$RUNNER_TEMP/guard.c" 2>> "$S"
          sleep 2 & PARENT=$!
          "$RUNNER_TEMP/guard" $PARENT > logs/v060_guard.txt 2>&1; echo "exit $?" >> logs/v060_guard.txt
          cat logs/v060_guard.txt
          grep -q "exit 3" logs/v060_guard.txt && say "parent-pid poll on macOS ends the child when the parent is gone: yes" || { say "parent-pid poll on macOS: NO"; PROBLEMS="$PROBLEMS guard-poll"; }
          { echo "### 0.6.0 pieces"; echo '```'; cat "$S"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PROBLEMS" ]; then echo "PROBLEMS with the 0.6.0 pieces:$PROBLEMS"; exit 1; fi

      # 0.7.0: the launcher's scripted tests that need no disc (SDL's software renderer, the game never started):
      #  - test_launcher_pad.py: every page and scenario with controller buttons only (tour, extra tabs, presets, quit, save keyboard, browser...);
      #  - test_modupdate.py: mod updates, dependencies, shared lists, key changes against a LOCAL feed (127.0.0.1). Written on Windows and never
      #    run elsewhere (its data folder is the APPDATA one): a failure here is only listed, "informational", it does not fail the run.
      - name: The launcher's scripted tests that need no disc (pad scenarios, mod updates)
        id: launchertests
        if: success() && inputs.stage == 'all'
        continue-on-error: true
        run: |
          set +e -u
          export SDL_RENDER_DRIVER=software SDL_AUDIODRIVER=dummy SDL_AUDIO_DRIVER=dummy XD_NO_MESSAGE_BOXES=1
          PROBLEMS=""
          mkdir -p logs/pad_shots logs/modupdate_shots
          perl -e 'alarm 1800; exec @ARGV' python3 tools/test_launcher_pad.py --build "$PWD/$BIN" --work "$RUNNER_TEMP/pad_test" > logs/launcher_pad_test.log 2>&1
          RC=$?
          echo "pad test exit $RC"; grep -E "^(FAIL|==|ALL PASSED|FAILED)" logs/launcher_pad_test.log | head -n 60
          [ $RC = 0 ] || PROBLEMS="$PROBLEMS pad-scenarios"
          ls "$RUNNER_TEMP"/pad_test/shots/*.png 2>/dev/null | head -n 30 | while read -r f; do cp "$f" logs/pad_shots/; done
          perl -e 'alarm 1800; exec @ARGV' python3 tools/test_modupdate.py --build "$PWD/$BIN" --work "$RUNNER_TEMP/modupdate_test" > logs/launcher_modupdate_test.log 2>&1
          RC2=$?
          echo "modupdate test exit $RC2 (informational)"; grep -E "^(FAIL|==|ALL OK|ALL PASSED|FAILED)" logs/launcher_modupdate_test.log | head -n 40
          ls "$RUNNER_TEMP"/modupdate_test/shots/*.png 2>/dev/null | head -n 20 | while read -r f; do cp "$f" logs/modupdate_shots/; done
          { echo "### Launcher scripted tests"; echo "- pad scenarios: $([ $RC = 0 ] && echo passed || echo FAILED)"
            echo "- mod updates (informational, first run off Windows): $([ $RC2 = 0 ] && echo passed || echo 'failed: see logs/launcher_modupdate_test.log')"; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PROBLEMS" ]; then echo "PROBLEMS:$PROBLEMS"; exit 1; fi

      # 0.7.0: the replay video encoder (tools/encode/xd_encode_avf.mm, AVFoundation): 30 black pictures + one second of a tone as a WAV, as
      # tools/showcase.py hands them over. It must give an .mp4 with a video track (avc1) AND a sound track (mp4a, about 1 s), and the
      # picture-only call must give one with no sound track. Needs no disc. Compiled with -DXD_BUILD_AVF_ENCODER=ON (the build step).
      - name: The replay video encoder (AVFoundation) writes picture and sound
        id: encoder
        if: success() && inputs.stage == 'all'
        continue-on-error: true
        run: |
          set +e -u
          E="$BIN/xd_encode"
          [ -x "$E" ] || { echo "xd_encode was not built (see the build log: AVFoundation / Objective-C++)"; exit 1; }
          W="$RUNNER_TEMP/enc"; rm -rf "$W"; mkdir -p "$W"
          python3 - "$W/tone.wav" <<'EOT'
          import math, struct, sys, wave
          w = wave.open(sys.argv[1], 'wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(48000)
          w.writeframes(b''.join(struct.pack('<hh', int(8000 * math.sin(i / 48000 * 2 * math.pi * 440)), int(8000 * math.sin(i / 48000 * 2 * math.pi * 660))) for i in range(48000)))
          w.close()
          EOT
          head -c $((320 * 240 * 4 * 30)) /dev/zero > "$W/frames.rgba"
          PROBLEMS=""
          "$E" --size 320x240 --fps 30 --audio "$W/tone.wav" --out "$W/with_sound.mp4" < "$W/frames.rgba" > logs/encoder_with_sound.txt 2>&1
          echo "exit $?" >> logs/encoder_with_sound.txt
          "$E" --size 320x240 --fps 30 --out "$W/video_only.mp4" < "$W/frames.rgba" > logs/encoder_video_only.txt 2>&1
          echo "exit $?" >> logs/encoder_video_only.txt
          cat logs/encoder_with_sound.txt logs/encoder_video_only.txt
          grep -q "^exit 0$" logs/encoder_with_sound.txt || PROBLEMS="$PROBLEMS with-sound-exit"
          grep -q "sound track written" logs/encoder_with_sound.txt || PROBLEMS="$PROBLEMS no-sound-line"
          grep -q "^exit 0$" logs/encoder_video_only.txt || PROBLEMS="$PROBLEMS video-only-exit"
          { ls -la "$W"; file "$W"/*.mp4; afinfo "$W/with_sound.mp4"; echo "== video-only:"; afinfo "$W/video_only.mp4"; } > logs/encoder_files.txt 2>&1
          cat logs/encoder_files.txt
          [ -s "$W/with_sound.mp4" ] || PROBLEMS="$PROBLEMS no-file"
          grep -q "avc1" "$W/with_sound.mp4" || PROBLEMS="$PROBLEMS no-h264"
          grep -q "mp4a" "$W/with_sound.mp4" || PROBLEMS="$PROBLEMS no-aac"
          grep -q "mp4a" "$W/video_only.mp4" && PROBLEMS="$PROBLEMS video-only-has-sound"
          ls "$W" | grep -E "\.(video\.mp4|audio\.m4a)$" && PROBLEMS="$PROBLEMS leftover-temp-files"
          cp "$W/with_sound.mp4" logs/encoder_with_sound.mp4
          if [ -n "$PROBLEMS" ]; then { echo "### Replay encoder: problems"; echo "$PROBLEMS (logs/encoder_*.txt)"; } >> "$GITHUB_STEP_SUMMARY"; echo "PROBLEMS:$PROBLEMS"; exit 1; fi
          echo "### Replay encoder: .mp4 with H.264 picture and AAC sound written (logs/encoder_with_sound.mp4)" >> "$GITHUB_STEP_SUMMARY"

      # 0.7.0 (cli-portable): the data folder next to the app. A copy of the unpacked app gets data_location.json beside it (never inside the
      # signed bundle); the game started from inside it must say "portable" for its user folder and use <folder>/portable. Also: the
      # command-line options reach the program through the app (--version, --help), and a plain start of the program keeps the user folder
      # under ~/Library/Application Support. The refusal while the app runs from /AppTranslocation/ cannot be tried here (only Finder
      # makes that path): the Read me lists it for a person.
      - name: The data folder next to the app (portable), the command-line options
        id: portable
        if: success() && inputs.stage == 'all'
        continue-on-error: true
        run: |
          set +e -u
          APP="$(find "$RUNNER_TEMP/unzipped" -name "Pokemon XD.app" -maxdepth 3 | head -n 1)"
          P="$RUNNER_TEMP/portable_test"; rm -rf "$P"; mkdir -p "$P/home"
          ditto "$APP" "$P/Pokemon XD.app"
          PROBLEMS=""
          {
            echo "== --version / --help through the launcher and the game"
            "$P/Pokemon XD.app/Contents/MacOS/xd_launcher" --no-launcher --version; echo "launcher --version exit $?"
            "$P/Pokemon XD.app/Contents/MacOS/xd" --version; echo "xd --version exit $?"
            "$P/Pokemon XD.app/Contents/MacOS/xd" --help | head -n 5; echo "xd --help exit ${PIPESTATUS[0]}"
            XD_NO_MESSAGE_BOXES=1 perl -e 'alarm 60; exec @ARGV' "$P/Pokemon XD.app/Contents/MacOS/xd" --bogus-option > /dev/null 2>&1; echo "xd --bogus-option exit $? (must be 2)"
            echo "== no descriptor: the user folder"
            ( cd "$P/Pokemon XD.app/Contents/MacOS" && HOME="$P/home" XD_TEST_RUN=1 XD_NO_MESSAGE_BOXES=1 XD_CRASH_REPORT=0 XD_SETTINGS_DIR="$P/settings" XD_CARD_DIR="$P/card" XD_CACHE_DIR="$P/cache" \
                perl -e 'alarm 120; exec @ARGV' ./xd 2>&1 | grep -E "^\[user folder\]|^\[launcher\]" | head -n 3 )
            echo "== data_location.json next to the app: portable"
            printf '{"version": 1, "mode": "portable"}\n' > "$P/data_location.json"
            ( cd "$P/Pokemon XD.app/Contents/MacOS" && HOME="$P/home" XD_TEST_RUN=1 XD_NO_MESSAGE_BOXES=1 XD_CRASH_REPORT=0 XD_SETTINGS_DIR="$P/settings" XD_CARD_DIR="$P/card" XD_CACHE_DIR="$P/cache" \
                perl -e 'alarm 120; exec @ARGV' ./xd 2>&1 | grep -E "^\[user folder\]" | head -n 3 )
            echo "== --data-folder wins"
            ( cd "$P/Pokemon XD.app/Contents/MacOS" && HOME="$P/home" XD_TEST_RUN=1 XD_NO_MESSAGE_BOXES=1 XD_CRASH_REPORT=0 XD_SETTINGS_DIR="$P/settings" XD_CARD_DIR="$P/card" XD_CACHE_DIR="$P/cache" \
                perl -e 'alarm 120; exec @ARGV' ./xd --data-folder "$P/other" 2>&1 | grep -E "^\[user folder\]" | head -n 3 )
            ls -la "$P"; ls -la "$P/portable" 2>&1 | head -n 8
          } > logs/portable_test.txt 2>&1
          cat logs/portable_test.txt
          grep -q "launcher --version exit 0" logs/portable_test.txt || PROBLEMS="$PROBLEMS launcher-version"
          grep -q "xd --version exit 0" logs/portable_test.txt || PROBLEMS="$PROBLEMS xd-version"
          grep -q "xd --bogus-option exit 2" logs/portable_test.txt || PROBLEMS="$PROBLEMS bad-option-exit"
          grep -q "^\[user folder\].*portable (data_location.json next to the app)" logs/portable_test.txt || PROBLEMS="$PROBLEMS portable-not-used"
          grep -q "^\[user folder\].*Library/Application Support/Pokemon XD" logs/portable_test.txt || PROBLEMS="$PROBLEMS user-folder-path"
          grep -q "^\[user folder\].*portable_test/other" logs/portable_test.txt || PROBLEMS="$PROBLEMS data-folder-flag"
          if [ -n "$PROBLEMS" ]; then { echo "### Portable data folder / options: problems"; echo "$PROBLEMS (logs/portable_test.txt)"; } >> "$GITHUB_STEP_SUMMARY"; echo "PROBLEMS:$PROBLEMS"; exit 1; fi
          echo "### Portable data folder next to the app and the command-line options work (logs/portable_test.txt)" >> "$GITHUB_STEP_SUMMARY"

      # The last step: the one place that says whether the run is clean. Every step above that may fail without stopping the run is looked at here.
      - name: Verdict (every step's outcome in one file)
        if: always() && inputs.stage == 'all'
        env:
          O_BUILD: ${{ steps.build.outcome }}
          O_TESTS: ${{ steps.tests.outcome }}
          O_PYTESTS: ${{ steps.pytests.outcome }}
          O_PBR: ${{ steps.pbrfreeze.outcome }}
          O_USUM: ${{ steps.usumfreeze.outcome }}
          O_PKG: ${{ steps.pkg.outcome }}
          O_PKGCHECK: ${{ steps.pkgcheck.outcome }}
          O_LAUNCHER: ${{ steps.launcher.outcome }}
          O_LAUNCHERTESTS: ${{ steps.launchertests.outcome }}
          O_UPDATER: ${{ steps.updater.outcome }}
          O_V060: ${{ steps.v060.outcome }}
          O_ENCODER: ${{ steps.encoder.outcome }}
          O_PORTABLE: ${{ steps.portable.outcome }}
          O_START: ${{ steps.start.outcome }}
        run: |
          set +e -u
          mkdir -p logs
          V=logs/VERDICT.txt; : > "$V"
          BAD=0
          say() { echo "$*" | tee -a "$V"; }
          row() { # <label> <outcome> <where to look>
            case "$2" in
              success) say "ok        $1" ;;
              skipped) say "SKIPPED   $1 (an earlier step failed, or it was not asked for)"; BAD=1 ;;
              *) say "FAILED    $1 ($2): $3"; BAD=1 ;;
            esac
          }
          say "Mac build verdict, $(date -u +%Y-%m-%dT%H:%MZ), machine ${{ inputs.machine }}"
          row "compile (game files first, the list, every other target)" "$O_BUILD" "logs/build.log, logs/errors.txt"
          grep -q "other targets: FAILED" logs/build.log 2>/dev/null && { say "FAILED    some target outside the list did not build: logs/other_targets.log"; BAD=1; }
          grep -q "own files: ERRORS" logs/build.log 2>/dev/null && { say "FAILED    the port's / game's own files had compile errors: logs/errors.txt"; BAD=1; }
          row "no-disc game start (memory below 4 GB, layout)" "$O_START" "logs/first_run_report.txt, logs/xd_header.txt"
          row "every unit test that needs no disc" "$O_TESTS" "logs/tests_summary.txt, logs/test_<name>.log"
          row "Python tests of the converters" "$O_PYTESTS" "logs/pytests_summary.txt"
          row "frozen pbr_models" "$O_PBR" "logs/pbr_models_package.log"
          row "frozen usum_models (Ultra Sun / Ultra Moon converter)" "$O_USUM" "logs/usum_models_package.log"
          row "the .app and the zip (package_mac.sh, signing)" "$O_PKG" "logs/package.log"
          row "the packed app: signatures, helpers, quarantine, one start" "$O_PKGCHECK" "logs/package_check.txt, package_helpers.txt, package_start.txt"
          row "the launcher in the app" "$O_LAUNCHER" "logs/launcher_*.txt"
          row "the launcher's scripted tests (pad scenarios)" "$O_LAUNCHERTESTS" "logs/launcher_pad_test.log"
          row "the updater on the Mac" "$O_UPDATER" "logs/updater_posix_test.log, update_test.log"
          row "0.6.0 pieces" "$O_V060" "logs/v060_summary.txt"
          row "the replay video encoder (picture + sound)" "$O_ENCODER" "logs/encoder_*.txt"
          row "portable data folder, command-line options" "$O_PORTABLE" "logs/portable_test.txt"
          [ -s logs/tests_failed.txt ] && say "tests that failed or are not built: $(cat logs/tests_failed.txt)"
          [ -f logs/launcher_modupdate_test.log ] && { grep -q -E "^(ALL OK|ALL PASSED)" logs/launcher_modupdate_test.log && say "info      mod-update scenarios passed" || grep -q "^SKIPPED" logs/launcher_modupdate_test.log || say "info      mod-update scenarios did not all pass (first run off Windows): logs/launcher_modupdate_test.log"; }
          for f in logs/launcher_pad_test.log logs/updater_posix_test.log logs/launcher_modupdate_test.log; do
            [ -f "$f" ] && grep "^SKIPPED" "$f" | while read -r l; do echo "info      $f: $l" | tee -a "$V"; done
          done
          if [ $BAD = 0 ]; then say "VERDICT: CLEAN"; else say "VERDICT: PROBLEMS (see the rows above)"; fi
          { echo "### Verdict"; echo '```'; cat "$V"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $BAD

      # The zip goes up whenever it was made: a failed check after packaging is a finding for the testers (the
      # verdict lists it), not a reason to lose the download (0.7.0: test-only gaps held the zip back).
      - name: Upload the Mac zip
        if: always() && inputs.stage == 'all' && hashFiles('dist/*.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: Pokemon XD PC - Mac (test)
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload the logs (always, also after a failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-build-logs
          path: |
            logs/**/*.log
            logs/*.txt
            logs/v060_*.txt
            logs/VERDICT.txt
            logs/encoder_with_sound.mp4
            logs/pad_shots/*.png
            logs/modupdate_shots/*.png
            logs/launcher_shots/*.png
            logs/updater_shots/*.png
            logs/updater_launcher_logs/*.log
            build/mac/mac-release/CMakeFiles/CMakeConfigureLog.yaml
            build/mac/mac-release/disc_tables/*.log
          retention-days: 14
          if-no-files-found: warn
